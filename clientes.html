<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes — Envíos Multicolor</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body hidden>
  <header class="app-header">
    <strong>Envíos Multicolor</strong>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="clientes.html" class="activo">Clientes</a>
      <a href="empaques.html">Empaques</a>
      <a href="realizar-envio.html">Realizar envío</a>
      <a href="historial.html">Historial</a>
      <a href="#" id="cerrar-sesion" class="cerrar-sesion">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="tarjeta">
      <h1>Clientes</h1>
      <form id="form-cliente">
        <div class="campo">
          <label for="nombre-cliente">Nombre del cliente</label>
          <input type="text" id="nombre-cliente" name="nombre" placeholder="Ej: Distribuidora Sol" required />
        </div>
        <div class="campo">
          <label for="telefono-cliente">Teléfono</label>
          <input type="tel" id="telefono-cliente" name="telefono" placeholder="Ej: 700 00000" />
        </div>
        <div class="campo">
          <label for="direccion-cliente">Dirección</label>
          <input type="text" id="direccion-cliente" name="direccion" placeholder="Ej: Av. Siempre Viva 123" />
        </div>
        <div class="campo">
          <label for="ciudad-cliente">Ciudad</label>
          <input type="text" id="ciudad-cliente" name="ciudad" placeholder="Ej: La Paz" />
        </div>
        <button type="submit">Guardar cliente</button>
      </form>
    </div>

    <div class="tarjeta">
      <div class="listado-clientes-titulo">
        <h2>Listado de clientes</h2>
        <button type="button" id="btn-abrir-editar-cliente" class="btn-secundario">
          Editar cliente
        </button>
      </div>
      <table id="tabla-clientes">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Ciudad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se completa dinámicamente desde js/clientes.js -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal para editar un cliente ya guardado: primero se busca por
       nombre, y recién cuando hay una coincidencia aparece el
       formulario con sus datos para corregir cualquier campo. -->
  <div class="modal-overlay" id="modal-editar-cliente" hidden>
    <div class="modal-stock">
      <div class="modal-stock-barra">
        <strong>Editar cliente</strong>
        <button type="button" id="btn-cerrar-modal-editar-cliente" class="btn-cerrar">✕ Cerrar</button>
      </div>

      <div class="modal-stock-cuerpo">
        <div class="campo">
          <label for="buscador-editar-cliente">Buscar cliente</label>
          <input
            type="text"
            id="buscador-editar-cliente"
            list="lista-clientes-editar"
            autocomplete="off"
            placeholder="Escribí el nombre del cliente"
          />
          <datalist id="lista-clientes-editar">
            <!-- Se completa dinámicamente desde js/clientes.js -->
          </datalist>
        </div>

        <form id="form-editar-cliente" hidden>
          <input type="hidden" id="editar-cliente-id" />
          <div class="campo">
            <label for="editar-nombre-cliente">Nombre</label>
            <input type="text" id="editar-nombre-cliente" required />
          </div>
          <div class="campo">
            <label for="editar-telefono-cliente">Teléfono</label>
            <input type="tel" id="editar-telefono-cliente" placeholder="Ej: 700 00000" />
          </div>
          <div class="campo">
            <label for="editar-direccion-cliente">Dirección</label>
            <input type="text" id="editar-direccion-cliente" placeholder="Ej: Av. Siempre Viva 123" />
          </div>
          <div class="campo">
            <label for="editar-ciudad-cliente">Ciudad</label>
            <input type="text" id="editar-ciudad-cliente" placeholder="Ej: La Paz" />
          </div>
          <button type="submit">Guardar cambios</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
