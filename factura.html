<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota de envío — Envíos Multicolor</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body hidden class="vista-factura">
  <div class="factura-barra">
    <a href="historial.html">← Volver al historial</a>
    <div class="menu-imprimir" id="menu-imprimir">
      <button type="button" id="btn-imprimir">Imprimir ▾</button>
      <div class="menu-imprimir-opciones" id="menu-imprimir-opciones" hidden>
        <button type="button" data-modo="producto">Detalle por producto</button>
        <button type="button" data-modo="paquete">Detalle por paquete</button>
        <button type="button" data-modo="completo">Detalle completo</button>
      </div>
    </div>
  </div>

  <div class="factura-hoja">
    <div class="factura-cabecera">
      <div class="factura-marca">
        <img src="assets/img/logo.png" class="factura-logo" alt="MultiColor" />
        <div>
          <strong>Nota de envío</strong>
          <p>Almacén Santa Cruz</p>
        </div>
      </div>
      <div class="factura-folio">
        <span id="factura-numero">E000000</span>
        Código de envío
      </div>
    </div>

    <p class="etiqueta-seccion">Datos del envío</p>
    <div class="factura-datos-cliente">
      <div><span class="etiqueta">Cliente:</span><span id="factura-cliente">—</span></div>
      <div><span class="etiqueta">Fecha:</span><span id="factura-fecha">—</span></div>
      <div><span class="etiqueta">Recibe:</span><span id="factura-receptor">—</span></div>
      <div><span class="etiqueta">Ciudad:</span><span id="factura-ciudad">—</span></div>
      <div><span class="etiqueta">Teléfono:</span><span id="factura-telefono">—</span></div>
      <div><span class="etiqueta">Dirección:</span><span id="factura-direccion">—</span></div>
    </div>

    <div class="factura-seccion" data-seccion="productos">
      <h2>Detalle de productos</h2>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
          </tr>
        </thead>
        <tbody id="factura-tabla-productos">
          <!-- Se completa dinámicamente desde js/factura.js -->
        </tbody>
      </table>
    </div>

    <div class="factura-seccion" data-seccion="empaques">
      <h2>Detalle de empaques</h2>
      <table>
        <thead>
          <tr>
            <th>Tipo de empaque</th>
            <th>Cantidad</th>
          </tr>
        </thead>
        <tbody id="factura-tabla-empaques">
          <!-- Se completa dinámicamente desde js/factura.js -->
        </tbody>
      </table>
    </div>

    <p id="factura-observaciones" hidden></p>

    <div class="factura-firma">
      <div>Firma quien entrega</div>
      <div>Firma quien recibe</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/factura.js"></script>
</body>
</html>
